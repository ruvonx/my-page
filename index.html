<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Official ASMR Relax Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 50%, #2d1a4a 0%, #0d1b2a 50%, #0a0f1e 100%);
      font-family: 'Inter', sans-serif;
      color: #e0e6f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Star dots background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 95%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 5%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 90%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Constellation lines - decorative */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(135deg, transparent 48%, rgba(100,150,255,0.04) 49%, rgba(100,150,255,0.04) 51%, transparent 52%),
        linear-gradient(45deg, transparent 48%, rgba(100,150,255,0.03) 49%, rgba(100,150,255,0.03) 51%, transparent 52%);
      background-size: 300px 300px, 250px 250px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    /* Profile block */
    .profile-block {
      background: rgba(20, 30, 55, 0.85);
      border: 1px solid rgba(80, 100, 160, 0.3);
      border-radius: 18px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a2a5e, #2e4a8a);
      border: 2px solid rgba(100, 140, 220, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid rgba(60, 90, 150, 0.4);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #a0c4ff;
      text-transform: uppercase;
    }

    .badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Image block */
    .image-block {
      background: rgba(20, 30, 55, 0.85);
      border: 1px solid rgba(80, 100, 160, 0.3);
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 4/3;
      backdrop-filter: blur(8px);
      position: relative;
    }

    .image-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #2d1b4e 30%, #1a2a3e 60%, #0d1b2a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: rgba(160, 180, 220, 0.4);
      font-size: 13px;
    }

    .image-placeholder span { font-size: 40px; }

    /* Buttons block */
    .buttons-block {
      background: rgba(20, 30, 55, 0.85);
      border: 1px solid rgba(80, 100, 160, 0.3);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-align: center;
      text-decoration: none;
      transition: filter 0.2s, transform 0.15s;
    }

    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-pink {
      background: linear-gradient(90deg, #e040b0 0%, #f06292 50%, #ff8a65 100%);
      color: #fff;
    }

    .btn-blue {
      background: linear-gradient(90deg, #3a4bd4 0%, #5b7cf7 50%, #7c5cbf 100%);
      color: #fff;
    }

    .desc {
      text-align: center;
      font-size: 11.5px;
      color: rgba(180, 200, 240, 0.55);
      line-height: 1.6;
      padding: 0 4px;
    }

    /* Footer links */
    .footer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .footer-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-links a {
      background: rgba(20, 30, 55, 0.75);
      border: 1px solid rgba(80, 100, 160, 0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11.5px;
      color: rgba(180, 200, 240, 0.7);
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      backdrop-filter: blur(6px);
    }

    .footer-links a:hover {
      background: rgba(80, 100, 200, 0.3);
      color: #e0e8ff;
    }

    .copyright {
      font-size: 11px;
      color: rgba(150, 170, 210, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Profile Block -->
    <div class="profile-block">
      <div class="avatar">🎧</div>
      <div class="badge">Official ASMR Relax Hub</div>
    </div>

    <!-- Image Block -->
    <div class="image-block">
      <!--
        আপনার নিজের ছবি যোগ করতে চাইলে:
        <img src="আপনার-ছবির-লিংক.jpg" alt="cover" />
        নিচের placeholder div টি মুছে দিন।
      -->
      <div class="image-placeholder">
        <span>🌸</span>
        আপনার ছবি এখানে বসান
      </div>
    </div>

    <!-- Buttons Block -->
    <div class="buttons-block">
      <a href="#" class="btn btn-pink">Enter the Private Room 🍓</a>
      <a href="#" class="btn btn-blue">Join Private Telegram 🔒</a>
      <p class="desc">
        Private relaxation access, calming visuals, soft atmosphere, and
        official updates in one clean place.
      </p>
    </div>

    <!-- Footer -->
    <div class="footer-block">
      <div class="footer-links">
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Safety</a>
      </div>
      <p class="copyright">© 2026 ASMR Hub. All rights reserved.</p>
    </div>

  </div>

</body>
</html>
